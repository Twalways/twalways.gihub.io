<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Pixel Gallery</title>
<style>
    /* 全体のレイアウト */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2c1624; /* 万が一の背景色 */
        font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    /* 1. 固定された背景層（提供された画像） */
    .fixed-bg {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        /* 提供された画像のURLを指定（必ずリポジトリにあるファイル名と合わせてください） */
        background-image: url('cloud.png'); /* あなたのリポジトリにある画像ファイル名 */
        /* ★ここを修正しました★ */
        /* アスペクト比を無視して、画面全体（ビューポート）に無理やり引き伸ばす */
        background-size: 100vw 100vh; 
        /* 画像を中央に配置 */
        background-position: center; 
        /* 画像を繰り返さない */
        background-repeat: no-repeat; 
        z-index: 1;
        /* 少し画像を粗くしてドット感を出す */
        image-rendering: pixelated;
    }

    /* 2. ドット質感層（ピクセルフィルター） */
    .pixel-layer {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 2;
        /* 3x3ピクセルの格子状ドット（rgbaの値を変更して調整可能） */
        background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 3px 3px;
        pointer-events: none; /* 下のボタンをクリックできるようにする */
    }

    /* 3. すりガラス層（夕暮れ感） */
    .glass-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 3;
        /* ぼかし（20px） */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        /* 夕暮れ時のオレンジ〜紫のグラデーション */
        background: linear-gradient(
            135deg, 
            rgba(255, 120, 50, 0.2), 
            rgba(80, 20, 100, 0.3)
        );
    }

    /* 4. コンテンツ層（ボタン） */
    .container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 4;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .gallery-btn {
        padding: 20px 50px;
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        letter-spacing: 4px;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px; /* あえて少しカクつかせてドット感を演出 */
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        transition: all 0.4s ease;
    }

    .gallery-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.8);
        letter-spacing: 6px;
        transform: scale(1.05);
    }
</style>
</head>
<body>

    <div class="fixed-bg"></div>
    <div class="pixel-layer"></div>
    <div class="glass-overlay"></div>

    <div class="container">
        <a href="gallery.html" class="gallery-btn">Enter Gallery</a>
    </div>

</body>
</html>
