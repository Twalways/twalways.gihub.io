<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Pixel Gallery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    /* 全体のレイアウト */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2c1624; /* 万が一の背景色 */
        font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    /* 1. スクロールする背景層（元の .fixed-bg を置き換え） */
    .scroll-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 1;
    }

    .scroll-track {
        display: flex;
        /* 画像4枚分の幅を持たせる */
        width: calc(100vw * 4); 
        /* 40秒かけて一定の速度で無限ループ（速度はここで調整可能） */
        animation: scroll-left 40s linear infinite;
    }

    .scroll-img {
        width: 100vw;
        height: 100vh;
        /* アスペクト比を無視して画面全体に無理やり引き伸ばす（元の background-size: 100vw 100vh; と同じ効果） */
        object-fit: fill; 
        /* 画像を少し粗くしてドット感を出す */
        image-rendering: pixelated;
    }

    /* 2枚目と4枚目の画像を左右反転させて切れ目をなくす */
    .mirrored {
        transform: scaleX(-1);
    }

    /* スクロールアニメーションの定義 */
    @keyframes scroll-left {
        0% { transform: translateX(0); }
        /* 4枚中、2枚分移動したところで0にリセット */
        100% { transform: translateX(-50%); }
    }

    /* 2. ドット質感層（ピクセルフィルター） */
    .pixel-layer {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 2;
        /* 3x3ピクセルの格子状ドット */
        background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 3px 3px;
        pointer-events: none; /* 下のボタンをクリックできるようにする */
    }

    /* 3. すりガラス層（夕暮れ感） */
    .glass-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 3;
        /* ぼかし（4px） */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        /* 夕暮れ時のオレンジ〜紫のグラデーション */
        background: linear-gradient(
            135deg, 
            rgba(255, 120, 50, 0.2), 
            rgba(80, 20, 100, 0.3)
        );
        pointer-events: none; /* ★追加：この層もクリックの邪魔にならないようにする */
    }

    /* 4. コンテンツ層（ボタン） */
    .container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 4;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .gallery-btn {
        padding: 20px 50px;
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        letter-spacing: 4px;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px; /* あえて少しカクつかせてドット感を演出 */
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        transition: all 0.4s ease;
    }

    .gallery-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.8);
        letter-spacing: 6px;
        transform: scale(1.05);
    }

    /* SNSアイコンの配置 */
    .sns-links {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10; /* すりガラスより上に表示 */
        display: flex;
        gap: 15px;
    }

    .sns-icon {
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 1.2rem;
        transition: all 0.3s ease;
    }

    .sns-icon:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* 各ブランドカラー（ホバー時に少し色を付けるとお洒落です） */
    .sns-icon.twitch:hover { color: #9146ff; }
    .sns-icon.twitter:hover { color: #1da1f2; }
    .sns-icon.email:hover { color: #ffb13b; }
    .sns-icon.pixiv:hover { 
        color: #0096ff; 
    }
    .sns-icon.pixiv span {
        font-weight: bold;
        font-style: italic;
        font-family: 'Arial Black', sans-serif;
    }
    
</style>
</head>
<body>

    <div class="sns-links">
        <a href="https://www.twitch.tv/tw_always" target="_blank" class="sns-icon twitch">
            <i class="fab fa-twitch"></i>
        </a>
        <a href="https://x.com/TW_always" target="_blank" class="sns-icon twitter">
            <i class="fab fa-x-twitter"></i>
        </a>
        <a href="mailto:towa1426@gmail.com" class="sns-icon email">
            <i class="fas fa-envelope"></i>
        </a>
        <a href="https://www.pixiv.net/users/98701240" target="_blank" class="sns-icon pixiv">
            <span>P</span>
        </a>
    </div>
    
    <!-- 1. スクロールする背景（元の .fixed-bg に該当） -->
    <div class="scroll-container">
        <div class="scroll-track">
            <img class="scroll-img" src="Images/cloud.png" alt="背景">
            <img class="scroll-img mirrored" src="Images/cloud.png" alt="背景">
            <img class="scroll-img" src="Images/cloud.png" alt="背景">
            <img class="scroll-img mirrored" src="Images/cloud.png" alt="背景">
        </div>
    </div>

    <!-- 2. エフェクト層 -->
    <div class="pixel-layer"></div>
    <div class="glass-overlay"></div>

    <!-- 3. コンテンツ層 -->
    <div class="container">
        <a href="gallery.html" class="gallery-btn">Enter Gallery</a>
    </div>

</body>
</html>
