<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Twilight Pixel</title>
<style>
    body, html {
        margin: 0; padding: 0;
        background-color: #2c1624; /* 背景はトップページと同じ色 */
        font-family: sans-serif;
        color: white;
    }

    /* ギャラリー全体の枠組み */
    .gallery-container {
        display: grid;
        /* 画面幅に合わせて自動で列数を増減させる（レスポンシブ） */
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        padding: 40px;
    }

    /* 各イラストのカード */
    .art-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .art-card:hover {
        transform: scale(1.05); /* マウスを乗せると少し大きく */
    }

    .art-card img {
        width: 100%;
        height: 200px;
        object-fit: cover; /* 画像を枠いっぱいに収める */
        display: block;
        image-rendering: pixelated; /* イラストもドット風に見せるならこれ */
    }

    .back-link {
        display: inline-block;
        margin: 20px 40px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
    }
</style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="gallery-container">
        <!-- イラストを増やすときは、下の <div class="art-card">...</div> をコピーして増やします -->
        
        <div class="art-card">
            <img src="イラスト1のファイル名.png" alt="作品1">
        </div>

        <div class="art-card">
            <img src="イラスト2のファイル名.png" alt="作品2">
        </div>

        <!-- ここにどんどん追加 -->

    </div>

</body>
</html>
