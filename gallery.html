<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Twilight Pixel</title>
<style>
    /* 全体設定 */
    body, html {
        margin: 0; padding: 0;
        background-color: #2c1624; /* 背景色 */
        font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
        color: white;
        min-height: 100vh;
    }

    /* 背景にドット質感をプラス（トップページと共通） */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 3px 3px;
        z-index: -1;
        pointer-events: none;
    }

    /* 戻るボタン */
    .back-link {
        display: inline-block;
        margin: 20px 40px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s;
    }
    .back-link:hover {
        color: white;
    }

    /* ギャラリー全体の枠組み */
    .gallery-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        padding: 0 40px 40px 40px;
    }

    /* 各イラストのカード */
    .art-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .art-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
    }

    .art-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        image-rendering: pixelated;
    }

    /* 作品タイトル（alt属性を表示） */
    .art-info {
        padding: 10px;
        font-size: 0.8rem;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
    }

    /* --- 拡大表示（ライトボックス） --- */
    #lightbox {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
    }

    #lightbox img {
        max-width: 90%;
        max-height: 90%;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.2);
        image-rendering: pixelated; /* 拡大してもパキッと表示 */
    }

</style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="gallery-container">
        <!-- イラストを追加する場合は、この div 単位でコピーして img src を変えてください -->
        <div class="art-card" onclick="openLightbox(this)">
            <img src="Images/illust.jpg" alt="背中で語る">
            <div class="art-info">背中で語る</div>
        </div>

        <div class="art-card" onclick="openLightbox(this)">
            <img src="Images/illust2.jpg" alt="午後の散歩">
            <div class="art-info">午後の散歩</div>
        </div>

        <div class="art-card" onclick="openLightbox(this)">
            <img src="Images/illust3.jpg" alt="ランニング">
            <div class="art-info">ランニング</div>
        </div>

        <div class="art-card" onclick="openLightbox(this)">
            <img src="Images/illust4.png" alt="アンダーウォーター">
            <div class="art-info">アンダーウォーター</div>
        </div>
    </div>

    <!-- 拡大表示用エリア -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        function openLightbox(element) {
            const img = element.querySelector('img');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Escキーで閉じる機能
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
